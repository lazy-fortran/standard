name: CI

on:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    runs-on: [self-hosted, itp-ubuntu24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/test-setup

      - name: Build grammars
        run: |
          make all ANTLR4="java -jar $ANTLR_JAR"

      # The runner allows two CPUs but reports 40, so `-n auto` started 40
      # workers. The fixture sweep, the slow F2008 intrinsic tests and the
      # LFortran dialect suites run in nightly.yml (job slow-tests); keep both
      # lists in step.
      - name: Run tests
        run: |
          python -m pytest tests -q -n "$(nproc)" \
            --ignore=tests/test_fixture_parsing.py \
            --ignore=tests/Fortran2008/test_basic_f2008_features.py \
            --ignore=tests/LFortran \
            --ignore=tests/LFortranInfer

      - name: Test the nightly triage logic
        run: python scripts/test_nightly_triage.py

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
